<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <title>Turbine 1.0</title>
    <link id="favicon" rel="icon" href="images/loader.png">
<link rel="stylesheet" href="style.css">

<style>

/* ===== TOP BAR ===== */
.top-bar {
    position: fixed;
    top: 0;
    width: 100%;
    height: 60px;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 10px;

    background: var(--accent2);
    backdrop-filter: blur(10px);

    border-bottom: 2px solid var(--accent);
    z-index: 999;
}

/* ICONS */
.nav-btn {
    width: 40px;
    height: 40px;

    padding: 8px;
    border-radius: 10px;

    cursor: pointer;

    transition: all 0.2s ease;
}

.nav-btn:hover {
    background: rgba(255,255,255,0.1);
    box-shadow: 0 0 10px var(--accent);
    transform: scale(1.05);
}

/* URL */
#urlInput {
    flex: 1;

    height: 40px;
    border-radius: 12px;

    border: none;
    outline: none;

    padding: 0 12px;

    background: rgba(0,0,0,0.5);
    color: white;
}

/* MENU PANEL */
.menu {
    position: fixed;
    top: 70px;
    right: 10px;

    background: rgba(0,0,0,0.8);
    border-radius: 12px;
    padding: 10px;

    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
}

.menu button {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
}

/* FRAME */
#browserFrame {
    position: fixed;
    top: 60px;

    width: 100%;
    height: calc(100vh - 60px);

    border: none;
}

</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">

    <img src="images/undo.png" class="nav-btn" onclick="goBack()">
    <img src="images/redo.png" class="nav-btn" onclick="goForward()">
    <img src="images/refresh.png" class="nav-btn" onclick="reloadPage()">

    <input id="urlInput" placeholder="Search or type URL">

    <img src="images/menu.png" class="nav-btn" onclick="toggleMenu()">

</div>

<!-- MENU -->
<div id="menu" class="menu">

    <button onclick="goHome()">return</button>
    <button onclick="openBlank()">about:blank</button>
    <button onclick="toggleFullscreen()">fullscreen</button>

</div>

<!-- FRAME -->
<iframe id="browserFrame"></iframe>

<script>

const frame = document.getElementById("browserFrame");
const urlInput = document.getElementById("urlInput");

/* ===== INIT ===== */
window.onload = () => {
    const params = new URLSearchParams(location.search);
    let url = params.get("url") || "start.html";

    loadURL(url);
};

/* ===== LOAD URL ===== */
function loadURL(url) {

    if (!url.startsWith("http") && !url.includes(".html")) {
        url = "https://duckduckgo.com/?q=" + encodeURIComponent(url);
    }

    frame.src = url;
    urlInput.value = url;
}

/* ===== ENTER KEY ===== */
urlInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        loadURL(urlInput.value);
    }
});

/* ===== NAVIGATION ===== */
function goBack() {
    try { frame.contentWindow.history.back(); } catch {}
}

function goForward() {
    try { frame.contentWindow.history.forward(); } catch {}
}

function reloadPage() {
    frame.src = frame.src;
}

/* ===== MENU ===== */
function toggleMenu() {
    const m = document.getElementById("menu");
    m.style.display = m.style.display === "flex" ? "none" : "flex";
}

/* ===== HOME ===== */
function goHome() {
    location.href = "index.html";
}

/* ===== ABOUT:BLANK CLOAK ===== */
function openBlank() {

    const win = window.open("about:blank", "_blank");

    const iframe = win.document.createElement("iframe");
    iframe.src = location.href;

    iframe.style.position = "fixed";
    iframe.style.top = "0";
    iframe.style.left = "0";
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "none";

    win.document.body.appendChild(iframe);
}

/* ===== FULLSCREEN ===== */
function toggleFullscreen() {

    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

</script>

</body>
</html>
